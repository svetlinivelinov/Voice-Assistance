services:
  telephony-service:
    build:
      context: .
      dockerfile: services/telephony-service/Dockerfile
    environment:
      NODE_ENV: development
      SERVICE_NAME: telephony-service
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

